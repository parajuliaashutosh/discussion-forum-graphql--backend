services:
  app:
    container_name: discussion-forum-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    command: npm run start
    depends_on:
      db:
        condition: service_healthy  # Wait for DB to be healthy before starting app
    networks:
      - app-network
  db:
    container_name: discussion-forum-db
    image: postgres:alpine
    volumes:
      - db:/home/postgres
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  db:
    driver: local
networks:
  app-network:
    driver: bridge